- name: Depot
  label: Depot
  label_plural: Depots
  kind: master
  module: logistics
  title_field: depot_name
  description: Where trips start and end.
  fields:
    - {name: depot_name, type: data, required: true, unique: true, in_list: true}
    - {name: address, type: text}
    - {name: latitude, type: decimal, description: "Degrees north, for ordering a trip's stops"}
    - {name: longitude, type: decimal, description: "Degrees east"}
  list: {columns: [depot_name], sort: depot_name asc}

- name: Vehicle
  label: Vehicle
  label_plural: Vehicles
  kind: master
  module: logistics
  title_field: registration
  fields:
    - {name: registration, type: data, required: true, unique: true, in_list: true}
    - {name: vehicle_type, type: select, options: [Van, Truck, Car, Bike], default: Van, in_list: true, in_filter: true}
    - {name: depot, type: link, to: Depot, in_list: true, in_filter: true}
    - {name: capacity_kg, type: decimal, required: true, label: Capacity (kg), in_list: true}
    - {name: status, type: select, options: [Available, Off Road], default: Available, in_list: true, in_filter: true, description: "Off road: in for service or repair, and not dispatched"}
    - {name: next_service_on, type: date}
    - {name: odometer_km, type: int, label: Odometer (km), description: "The latest reading: fuel logs move it on, never back"}
    - {name: service_every_km, type: int, label: Service Every (km)}
    - {name: last_service_km, type: int, label: Last Service At (km)}
    - {name: service_due, type: check, read_only: true, no_copy: true, in_list: true, in_filter: true, description: "Its service is due by the day or by the kilometres"}
    - {name: cost_per_km, type: currency, label: Cost per km, description: "What a kilometre costs to run it: a completed trip's cost is its distance at this rate"}
  actions:
    - {name: serviced, label: It Was Serviced, permission: write,
       params: [{name: odometer_km, type: int, label: Odometer (km), required: true}, {name: next_service_on, type: date, label: Next Service On}]}
  list: {columns: [registration, vehicle_type, depot, capacity_kg, status, service_due], sort: registration asc}

- name: Driver
  label: Driver
  label_plural: Drivers
  kind: master
  module: logistics
  title_field: full_name
  fields:
    - {name: full_name, type: data, required: true, in_list: true}
    - {name: email, type: email, unique: true, in_list: true, description: "Their sign-in: the trips they drive are theirs to record"}
    - {name: phone, type: phone}
    - {name: licence_number, type: data, required: true}
    - {name: licence_expires_on, type: date, required: true, in_list: true}
    - {name: status, type: select, options: [Active, Inactive], default: Active, in_list: true, in_filter: true}
  list: {columns: [full_name, email, licence_expires_on, status], sort: full_name asc}

- name: TripStop
  label: Stop
  kind: child
  fields:
    - {name: sequence, type: int, in_list: true, description: "The order it is visited in"}
    - {name: kind, type: select, options: [Delivery, Collection], default: Delivery, in_list: true, description: "A collection brings goods back: a return, picked up on the way"}
    - {name: customer, type: link, to: Customer, in_list: true}
    - {name: delivery_note, type: link, to: DeliveryNote, in_list: true, link_filters: {is_return: false}}
    - {name: return_note, type: link, to: DeliveryNote, link_filters: {is_return: true}, description: "A collection's return delivery note, in draft: submitted when the goods are collected, so they are back in stock"}
    - {name: window_from, type: data, label: Window Opens, description: "HH:MM: the earliest it is expected"}
    - {name: window_to, type: data, label: Window Closes, description: "HH:MM: the latest it is expected"}
    - {name: address, type: text, required: true}
    - {name: latitude, type: decimal}
    - {name: longitude, type: decimal}
    - {name: weight_kg, type: decimal, default: 0, label: Weight (kg), in_list: true}
    - {name: status, type: select, options: [Pending, Delivered, Collected, Failed], default: Pending, read_only: true, in_list: true}
    - {name: delivered_at, type: datetime, read_only: true}
    - {name: late, type: check, read_only: true, description: "Its proof was recorded after its window closed"}

- name: Trip
  label: Trip
  label_plural: Trips
  kind: master
  module: logistics
  title_field: date
  description: A vehicle and its driver out for a day, with its stops in order, deliveries and collections, each in its window. Dispatched, each stop is proved delivered, collected or failed; completed, its cost is its distance at the vehicle's rate.
  fields:
    - {name: date, type: date, required: true, in_list: true, in_filter: true}
    - {name: depot, type: link, to: Depot, required: true, in_filter: true}
    - {name: vehicle, type: link, to: Vehicle, required: true, in_list: true, in_filter: true}
    - {name: driver, type: link, to: Driver, required: true, in_list: true, in_filter: true}
    - {name: stops, type: table, of: TripStop}
    - {name: total_weight, type: decimal, read_only: true, label: Load (kg), in_list: true}
    - {name: distance_km, type: decimal, read_only: true, label: "Distance (km, straight line)", description: "From the depot through the stops in order and back, as the crow flies"}
    - {name: status, type: select, options: [Planned, Dispatched, Completed, Cancelled], default: Planned, read_only: true, no_copy: true, in_list: true, in_filter: true}
    - {name: dispatched_at, type: datetime, read_only: true, no_copy: true}
    - {name: completed_at, type: datetime, read_only: true, no_copy: true}
    - {name: cost, type: currency, read_only: true, no_copy: true, in_list: true, description: "Its distance at the vehicle's cost per km, once it is completed"}
  actions:
    - {name: plan_route, label: Order the Stops, permission: write, condition: "doc.status == 'Planned'"}
    - {name: dispatch, label: Dispatch It, permission: write, condition: "doc.status == 'Planned'"}
    - {name: complete, label: Complete It, permission: write, condition: "doc.status == 'Dispatched'"}
    - {name: cancel_trip, label: Cancel It, permission: write, condition: "doc.status == 'Planned' || doc.status == 'Dispatched'"}
  numbering: {template: "TRP-{YYYY}-{seq:5}"}
  list: {columns: [number, date, vehicle, driver, total_weight, status], sort: date desc}

- name: ProofOfDelivery
  label: Proof of Delivery
  label_plural: Proofs of Delivery
  kind: master
  module: logistics
  title_field: received_by
  description: What happened at a stop, recorded by its driver. It marks the stop delivered or failed.
  fields:
    - {name: trip, type: link, to: Trip, required: true, in_list: true, in_filter: true}
    - {name: stop, type: int, required: true, in_list: true, description: "The stop's place in the trip"}
    - {name: outcome, type: select, options: [Delivered, Collected, Refused, Damaged, Not Home], default: Delivered, required: true, in_list: true, in_filter: true, description: "Collected: a collection's goods were handed over"}
    - {name: received_by, type: data, in_list: true, description: "Who took the goods, or handed over those collected"}
    - {name: signature, type: attach}
    - {name: photo, type: attach}
    - {name: note, type: text}
    - {name: happened_at, type: datetime, label: When It Happened, no_copy: true, description: "By the driver's phone: a proof sent later, after working offline, keeps its time. Not later than now, nor before the trip went out"}
    - {name: latitude, type: decimal}
    - {name: longitude, type: decimal}
    - {name: recorded_by, type: data, read_only: true, no_copy: true}
  list: {columns: [trip, stop, outcome, received_by, happened_at], sort: created_at desc}

- name: FuelLog
  label: Fuel Log
  label_plural: Fuel Logs
  kind: master
  module: logistics
  title_field: vehicle
  description: Fuel put in a vehicle, with what it cost and the odometer then, which moves the vehicle's reading on.
  fields:
    - {name: vehicle, type: link, to: Vehicle, required: true, in_list: true, in_filter: true}
    - {name: date, type: date, required: true, default_expr: today, in_list: true, in_filter: true}
    - {name: litres, type: decimal, required: true, in_list: true}
    - {name: cost, type: currency, in_list: true}
    - {name: odometer_km, type: int, label: Odometer (km), in_list: true}
    - {name: driver, type: link, to: Driver, in_filter: true}
    - {name: note, type: data}
  list: {columns: [vehicle, date, litres, cost, odometer_km], sort: date desc}
