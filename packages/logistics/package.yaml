package: logistics
version: 0.1.0
label: Logistics
description: "Depots, vehicles and drivers, trips dispatched with their stops in order and in their windows, deliveries and collections proved, and the fleet's fuel, services and costs"
depends: [core, products, selling]
field_prefix: logistics_

overlays:
  - entity: Item
    ops:
      - {op: add_field, field: {name: logistics_weight_kg, type: decimal, label: Weight (kg),
          description: "One unit's weight: a stop with no weight typed takes its goods' from it"}}

modules:
  - name: logistics
    label: Logistics
    icon: truck
    order: 53
    items: [Trip, ProofOfDelivery, Vehicle, FuelLog, Driver, Depot]

roles:
  - name: Fleet Dispatcher
    description: Plans and dispatches trips, keeps the fleet and its drivers, and sees every proof of delivery.
    permissions:
      - {entity: Depot, read: true, write: true, create: true}
      - {entity: Vehicle, read: true, write: true, create: true, export: true}
      - {entity: Driver, read: true, write: true, create: true, export: true}
      - {entity: Trip, read: true, write: true, create: true, export: true}
      - {entity: ProofOfDelivery, read: true, create: true, export: true}
      - {entity: FuelLog, read: true, write: true, create: true, export: true}
      - {entity: Customer, read: true}
      - {entity: DeliveryNote, read: true}
  - name: Driver
    description: Drives trips and records what happened at each stop.
    permissions:
      - {entity: Trip, read: true}
      - {entity: Vehicle, read: true}
      - {entity: Depot, read: true}
      - {entity: ProofOfDelivery, read: true, create: true}
      - {entity: FuelLog, read: true, create: true}

personal_data:
  - {entity: Driver, match: email, phone: phone, name: full_name, erase: [full_name, email, phone, licence_number, licence_expires_on]}
