id: logistics
name: Logistics
version: 0.3.12
publisher: cbferrum
summary: "Depots, vehicles and drivers, trips of deliveries and collections in their windows, proof of delivery that works offline, and the fleet's fuel, services and costs"
description: README.md
categories: [inventory, sales]
license: AGPL-3.0-only
homepage: https://github.com/CBFerrum/ferrum-app-logistics
support: https://github.com/CBFerrum/ferrum-app-logistics/issues
runtime: native
platform: ">=0.3.2, <0.4"
# Delivery notes and customers are ERP's: installing it installs ERP.
requires: {erp: ">=0.1"}
packages: [logistics]
uninstall: ask
# Its own interface at /logistics/: today's trips and services due for dispatchers, and a driver's
# stops, which open offline under its own worker (ui/public/sw.js).
ui:
  dist: ui/dist
contributes:
  shell.app:
    - id: logistics
      route: logistics
      title: Logistics
      description: Trips, drivers' stops, proof of delivery and the fleet
      icon: truck
      color: "#1d4ed8"
      roles: [Fleet Dispatcher, Driver]
  shell.open:
    - {id: logistics, package: logistics, path: "logistics/e/{entity}/{id}", list: "logistics/e/{entity}"}
  shell.create:
    - {id: trip, label: Trip, path: logistics/e/Trip/new, entity: Trip}
    - {id: fuel, label: Fuel Log, path: logistics/e/FuelLog/new, entity: FuelLog}
  # What the assistant should know in Logistics's pages, and what it suggests asking there.
  shell.assistant:
    - id: logistics
      title: "Logistics"
      instructions: >-
        A Trip (Planned, Dispatched, Completed, Cancelled) takes a Vehicle and a Driver from a Depot through its stops
        (TripStop), each a delivery or a collection within its window: Pending, Delivered, Collected or Failed. A
        ProofOfDelivery is taken at the stop, even offline, so a recent stop may still be on its way. Fuel logs and
        services make up a vehicle's costs.
      suggestions:
        - "Which trips are out today?"
        - "Which stops failed this week, and why?"
        - "Which vehicles are off the road?"
        - "What did each vehicle cost in fuel this month?"
